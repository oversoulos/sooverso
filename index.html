<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>so overso</title>
    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0e27;
            color: #e0e0ff;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* CRT scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }
        
        /* ============================================
           FONTS
           ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        
        /* ============================================
           SPLASH LOGO
           ============================================ */
        #splashLogo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0e27;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        
        #splashLogo .logo-text {
            font-family: 'Press Start 2P', 'Comic Sans MS', cursive;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00ff, #00ffff, #ff6600, #ff00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoWiggle 2s ease-in-out infinite, logoShift 3s linear infinite;
            text-shadow: 0 0 60px rgba(255,0,255,0.3);
            transform: rotate(-2deg) scale(0.9);
            padding: 30px 50px;
            position: relative;
        }
        
        #splashLogo .logo-text::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            right: -10px; bottom: -10px;
            background: radial-gradient(circle at 30% 40%, 
                rgba(255,0,255,0.15), 
                rgba(0,255,255,0.05) 70%, 
                transparent
            );
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 
                68% 57%, 79% 91%, 50% 70%, 
                21% 91%, 32% 57%, 2% 35%, 
                39% 35%
            );
            z-index: -1;
            animation: splatPulse 3s ease-in-out infinite;
        }
        
        @keyframes logoWiggle {
            0%, 100% { transform: rotate(-2deg) scale(0.9); }
            50% { transform: rotate(2deg) scale(1.05); }
        }
        
        @keyframes logoShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes splatPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        /* ============================================
           APP LAYOUT
           ============================================ */
        .app {
            display: grid;
            grid-template-columns: 1fr 0fr;
            transition: grid-template-columns 0.3s ease;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        
        .app.chat-open {
            grid-template-columns: 0.45fr 0.55fr;
        }
        
        /* ============================================
           DUEL ARENA
           ============================================ */
        .duel-arena {
            padding: 15px;
            overflow-y: auto;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .duel-arena.chat-open {
            opacity: 0.6;
            filter: blur(0.5px);
        }
        
        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        
        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .profile .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.3);
            background: #1a1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .profile .username {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #00ffff;
        }
        
        .room-controls {
            display: flex;
            gap: 8px;
        }
        
        .room-controls button {
            background: transparent;
            border: 1px solid rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .room-controls button:hover {
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
        }
        
        /* ============================================
           PRODUCT CARDS (Sticker-shaped)
           ============================================ */
        .duel-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            align-content: center;
        }
        
        .product-card {
            clip-path: polygon(
                0% 5%, 5% 0%, 95% 0%, 100% 5%,
                100% 95%, 95% 100%, 5% 100%, 0% 95%
            );
            border: 1px solid rgba(0, 255, 255, 0.2);
            background: rgba(26, 31, 58, 0.7);
            backdrop-filter: blur(4px);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform: rotate(var(--tilt, -1deg));
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.03);
        }
        
        .product-card:hover {
            transform: rotate(0deg) scale(1.02);
            border-color: rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.08);
        }
        
        .product-card:nth-child(odd) { --tilt: 1.5deg; }
        .product-card:nth-child(even) { --tilt: -1.2deg; }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px;
            right: -8px; bottom: -8px;
            background: radial-gradient(circle at 30% 40%, 
                rgba(255,0,255,0.06), 
                rgba(0,255,255,0.02) 70%, 
                transparent
            );
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 
                68% 57%, 79% 91%, 50% 70%, 
                21% 91%, 32% 57%, 2% 35%, 
                39% 35%
            );
            z-index: -1;
            opacity: 0.4;
        }
        
        .product-card .merchant-badge {
            display: inline-block;
            background: rgba(255, 0, 255, 0.15);
            color: #ff00ff;
            padding: 3px 12px;
            font-size: 0.7rem;
            font-family: 'VT323', monospace;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 0, 255, 0.1);
        }
        
        .product-card .product-emoji {
            font-size: 3rem;
            text-align: center;
            padding: 15px 0;
            filter: drop-shadow(0 0 20px rgba(0,255,255,0.1));
        }
        
        .product-card .product-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: #00ffff;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .product-card .product-price {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            color: #00ff00;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0,255,0,0.1);
        }
        
        .product-card .product-desc {
            color: #b0b0ff;
            font-size: 0.8rem;
            font-family: 'VT323', monospace;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .product-card .vote-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border: 1px solid rgba(0, 255, 0, 0.2);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .product-card .vote-btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.05);
        }
        
        .product-card .vote-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* ============================================
           CHAT PANEL
           ============================================ */
        .chat-panel {
            background: rgba(10, 14, 39, 0.97);
            border-left: 1px solid rgba(0, 255, 255, 0.08);
            padding: 20px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .chat-panel.open {
            transform: translateX(0);
        }
        
        .chat-panel .chat-header {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: #ff00ff;
            border-bottom: 1px solid rgba(255, 0, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        
        .chat-panel .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .chat-panel .chat-message {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(26, 31, 58, 0.5);
            border-left: 2px solid rgba(0, 255, 255, 0.1);
            font-family: 'VT323', monospace;
            font-size: 0.95rem;
            color: #b0b0ff;
        }
        
        .chat-panel .chat-message .msg-user {
            color: #00ffff;
            font-weight: bold;
        }
        
        .chat-panel .chat-input {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .chat-panel .chat-input input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.1);
            color: #e0e0ff;
            font-family: 'VT323', monospace;
            font-size: 1rem;
        }
        
        .chat-panel .chat-input input:focus {
            outline: none;
            border-color: rgba(255, 0, 255, 0.3);
        }
        
        .chat-panel .chat-input button {
            padding: 10px 20px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .chat-panel .chat-input button:hover {
            background: rgba(255, 0, 255, 0.2);
        }
        
        /* ============================================
           ROOMS DROPDOWN
           ============================================ */
        .rooms-dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(10, 14, 39, 0.98);
            border: 1px solid rgba(0, 255, 255, 0.1);
            padding: 15px;
            min-width: 200px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .rooms-dropdown.open {
            display: block;
        }
        
        .rooms-dropdown .room-item {
            padding: 8px 12px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            color: #b0b0ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
        }
        
        .rooms-dropdown .room-item:hover {
            background: rgba(0, 255, 255, 0.05);
            color: #00ffff;
        }
        
        /* ============================================
           EMPTY STATE
           ============================================ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }
        
        .empty-state .big-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .empty-state h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #ff00ff;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #b0b0ff;
            margin-bottom: 5px;
        }
        
        .empty-state .invite-prompt {
            margin-top: 20px;
            padding: 15px 30px;
            border: 1px dashed rgba(255, 0, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'VT323', monospace;
            color: #ff00ff;
        }
        
        .empty-state .invite-prompt:hover {
            background: rgba(255, 0, 255, 0.05);
        }
        
        /* ============================================
           TICKER
           ============================================ */
        .ticker {
            padding: 8px 15px;
            border-top: 1px solid rgba(0, 255, 255, 0.05);
            font-family: 'VT323', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .ticker marquee {
            display: block;
        }
        
        /* ============================================
           LOGIN OVERLAY
           ============================================ */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }
        
        .login-overlay.open {
            display: flex;
        }
        
        .login-box {
            background: rgba(26, 31, 58, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        
        .login-box h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .login-box .form-group {
            margin-bottom: 15px;
        }
        
        .login-box .form-group label {
            display: block;
            font-family: 'VT323', monospace;
            color: #ff00ff;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .login-box .form-group input,
        .login-box .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(10, 14, 39, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.1);
            color: #e0e0ff;
            font-family: 'VT323', monospace;
            font-size: 1rem;
        }
        
        .login-box .form-group input:focus,
        .login-box .form-group select:focus {
            outline: none;
            border-color: rgba(255, 0, 255, 0.3);
        }
        
        .login-box .login-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.2);
            color: #00ff00;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .login-box .login-btn:hover {
            background: rgba(0, 255, 0, 0.2);
        }
        
        .login-box .close-login {
            margin-top: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
        }
        
        .login-box .close-login:hover {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* ============================================
           GUMBALL OVERLAY
           ============================================ */
        .gumball-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .gumball-overlay.active {
            display: flex;
        }
        
        .gumball {
            font-size: 8rem;
            animation: gumballDrop 1.8s ease forwards;
        }
        
        @keyframes gumballDrop {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            40% { transform: scale(1.8) rotate(180deg); opacity: 1; }
            70% { transform: scale(0.8) rotate(270deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }
        
        /* ============================================
           TORNADO FINISHER
           ============================================ */
        .finisher {
            position: fixed;
            font-size: 5rem;
            pointer-events: none;
            z-index: 9998;
            image-rendering: pixelated;
        }
        
        @keyframes tornadoSlide {
            0% { top: 20%; left: -10%; transform: rotate(0deg) scale(1); opacity: 1; }
            20% { top: 35%; left: 20%; transform: rotate(60deg) scale(1.3); opacity: 1; }
            40% { top: 15%; left: 45%; transform: rotate(120deg) scale(0.8); opacity: 1; }
            60% { top: 50%; left: 60%; transform: rotate(180deg) scale(1.6); opacity: 1; }
            80% { top: 30%; left: 80%; transform: rotate(240deg) scale(0.9); opacity: 1; }
            100% { top: 60%; left: 110%; transform: rotate(360deg) scale(1); opacity: 0; }
        }
        
        @keyframes flushDown {
            0% { top: -10%; left: 50%; transform: rotate(0deg) scale(1); opacity: 1; }
            100% { top: 110%; left: 30%; transform: rotate(720deg) scale(0.3); opacity: 0; }
        }
        
        /* ============================================
           PAYMENT MODAL
           ============================================ */
        .payment-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 9997;
            align-items: center;
            justify-content: center;
        }
        
        .payment-modal.open {
            display: flex;
        }
        
        .payment-box {
            background: rgba(26, 31, 58, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .payment-box h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            color: #00ffff;
            margin-bottom: 20px;
        }
        
        .payment-box .pay-method {
            padding: 12px;
            margin: 8px 0;
            border: 1px solid rgba(0, 255, 255, 0.1);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #b0b0ff;
            transition: all 0.2s;
        }
        
        .payment-box .pay-method:hover {
            background: rgba(0, 255, 255, 0.05);
            border-color: rgba(255, 0, 255, 0.2);
        }
        
        .payment-box .pay-method.active {
            background: rgba(0, 255, 0, 0.05);
            border-color: rgba(0, 255, 0, 0.2);
        }
        
        .payment-box #qrcode {
            margin: 20px auto;
        }
        
        .payment-box #qrcode canvas {
            border: 1px solid rgba(255, 0, 255, 0.1);
        }
        
        .payment-box .close-payment {
            margin-top: 20px;
            padding: 10px 30px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.1);
            color: rgba(255, 100, 100, 0.5);
            cursor: pointer;
            font-family: 'VT323', monospace;
            transition: all 0.2s;
        }
        
        .payment-box .close-payment:hover {
            background: rgba(255, 0, 0, 0.15);
        }
        
        /* ============================================
           ALERTS
           ============================================ */
        #alerts {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9996;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }
        
        .alert {
            padding: 12px 20px;
            margin-bottom: 8px;
            border: 1px solid;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            animation: alertSlide 0.3s ease;
            pointer-events: auto;
            text-align: center;
        }
        
        .alert.success {
            border-color: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            background: rgba(0, 255, 0, 0.05);
        }
        
        .alert.error {
            border-color: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            background: rgba(255, 0, 0, 0.05);
        }
        
        .alert.info {
            border-color: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            background: rgba(0, 255, 255, 0.05);
        }
        
        @keyframes alertSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(10, 14, 39, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.05);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 0, 255, 0.2);
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .app.chat-open {
                grid-template-columns: 1fr;
            }
            
            .chat-panel {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                transform: translateX(100%);
                z-index: 9995;
            }
            
            .chat-panel.open {
                transform: translateX(0);
            }
            
            .duel-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            #splashLogo .logo-text {
                font-size: 2.5rem;
                padding: 20px 30px;
            }
            
            .topbar {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .rooms-dropdown {
                right: 10px;
                top: 50px;
                min-width: 150px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.5.3/qrcode.min.js"></script>
</head>
<body>

    <!-- ============================================
    SPLASH LOGO
    ============================================ -->
    <div id="splashLogo">
        <div class="logo-text">so overso</div>
    </div>

    <!-- ============================================
    GUMBALL OVERLAY
    ============================================ -->
    <div class="gumball-overlay" id="gumballOverlay">
        <div class="gumball" id="gumballDisplay">🟠</div>
    </div>

    <!-- ============================================
    ALERTS
    ============================================ -->
    <div id="alerts"></div>

    <!-- ============================================
    MAIN APP
    ============================================ -->
    <div class="app" id="app">

        <!-- ============================================
        DUEL ARENA
        ============================================ -->
        <div class="duel-arena" id="duelArena">
            
            <!-- Top Bar -->
            <div class="topbar">
                <div class="profile" onclick="toggleLogin()">
                    <div class="avatar" id="avatarDisplay">👤</div>
                    <span class="username" id="usernameDisplay">guest</span>
                </div>
                <div class="room-controls">
                    <button onclick="toggleRooms()">rooms ▼</button>
                    <button onclick="toggleChat()" id="chatToggle">chat</button>
                </div>
            </div>

            <!-- Rooms Dropdown -->
            <div class="rooms-dropdown" id="roomsDropdown">
                <div class="room-item" onclick="joinRoom('general')"># general</div>
                <div class="room-item" onclick="joinRoom('market')"># market</div>
                <div class="room-item" onclick="joinRoom('show-and-tell')"># show-and-tell</div>
            </div>

            <!-- Duel Container -->
            <div class="duel-container" id="duelContainer">
                <!-- Rendered by JS -->
            </div>

            <!-- Ticker -->
            <div class="ticker" id="ticker">
                <marquee behavior="scroll" direction="left" scrollamount="3">
                    🏆 so overso • where products duel • vote now • check back daily • 
                </marquee>
            </div>
        </div>

        <!-- ============================================
        CHAT PANEL
        ============================================ -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">💬 chat</div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message"><span class="msg-user">system:</span> welcome to so overso</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="say something..." onkeydown="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">send</button>
            </div>
        </div>
    </div>

    <!-- ============================================
    LOGIN OVERLAY
    ============================================ -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>come in</h2>
            <div class="form-group">
                <label>username</label>
                <input type="text" id="loginUsername" placeholder="your handle">
            </div>
            <div class="form-group">
                <label>email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>i am a...</label>
                <select id="loginType">
                    <option value="shopper">shopper</option>
                    <option value="merchant">merchant</option>
                    <option value="community">community builder</option>
                </select>
            </div>
            <button class="login-btn" onclick="handleLogin()">enter</button>
            <div class="close-login" onclick="toggleLogin()">maybe later</div>
        </div>
    </div>

    <!-- ============================================
    PAYMENT MODAL
    ============================================ -->
    <div class="payment-modal" id="paymentModal">
        <div class="payment-box">
            <h2>⚡ 3-click checkout</h2>
            <div class="pay-method" onclick="selectPayment('stripe')">💳 stripe</div>
            <div class="pay-method" onclick="selectPayment('paypal')">🔵 paypal</div>
            <div class="pay-method" onclick="selectPayment('crypto')">₿ crypto</div>
            <div class="pay-method" onclick="selectPayment('tg')">✈️ telegram</div>
            <div id="qrcode" style="display:none;"></div>
            <p id="paymentInfo" style="color: #00ff00; margin-top: 20px; display: none;"></p>
            <button class="close-payment" onclick="closePayment()">close</button>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // DATA
        // ============================================
        let currentUser = null;
        let currentDuel = null;
        let chatOpen = false;
        let roomsOpen = false;
        let userVotes = [];
        
        const SAMPLE_DUELS = [
            { id: 1, prod1: { name: 'Hand-painted D&D Mini', price: '$19.99', merchant: 'ArtByAlex', wins: 234, emoji: '🎨' }, prod2: { name: 'Mold-cast Resin Copy', price: '$24.99', merchant: 'CastCo', wins: 189, emoji: '🗿' } },
            { id: 2, prod1: { name: '3-Hour Zine About Mushrooms', price: '$99', merchant: 'FungalPress', wins: 156, emoji: '🍄' }, prod2: { name: 'AI-Generated Plant Guide', price: '$79', merchant: 'BotGen', wins: 198, emoji: '🌱' } },
            { id: 3, prod1: { name: 'Custom Keyboard Cable', price: '$49', merchant: 'CableWitch', wins: 312, emoji: '🔌' }, prod2: { name: 'Mass-Produced USB Cord', price: '$39', merchant: 'BigTech', wins: 267, emoji: '⚡' } },
            { id: 4, prod1: { name: 'Vintage Denim Jacket', price: '$89', merchant: 'ThriftKing', wins: 98, emoji: '👕' }, prod2: { name: 'Fast Fashion Copy', price: '$59', merchant: 'TrendFast', wins: 76, emoji: '🧥' } },
            { id: 5, prod1: { name: 'Custom Leather Wallet', price: '$65', merchant: 'HideAndStitch', wins: 145, emoji: '👛' }, prod2: { name: 'Mass-Market Wallet', price: '$35', merchant: 'WalletWorld', wins: 112, emoji: '💳' } }
        ];

        const gumballStickers = [
            '⭐', '🌈', '🌀', '🔥', '💀', '👾', '🤖', '👽', 
            '🦄', '🍕', '🎮', '📼', '📟', '💾', '📠', '☎️',
            '🌪️', '🚽', '🎯', '💎', '🎲', '🧩', '🎪', '🎭'
        ];

        const skins = {
            default: { background: '#0a0e27', accent: '#00ffff', accent2: '#ff00ff', font: 'VT323', borderStyle: 'solid' },
            retroAim: { background: '#2a2a2a', accent: '#00ff00', accent2: '#ffffff', font: 'Arial', borderStyle: 'ridge' },
            yahoo: { background: '#1a1a2e', accent: '#ffcc00', accent2: '#ffffff', font: 'Verdana', borderStyle: 'groove' },
            icq: { background: '#0a0a0a', accent: '#00cc00', accent2: '#ff6600', font: 'Tahoma', borderStyle: 'double' },
            cyberdeck: { background: '#000000', accent: '#00ff88', accent2: '#ff00ff', font: 'VT323', borderStyle: 'solid' }
        };

        // ============================================
        // INIT
        // ============================================
        function init() {
            loadUser();
            loadDuel();
            updateTicker();
            setupSplash();
        }

        function setupSplash() {
            setTimeout(() => {
                const splash = document.getElementById('splashLogo');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 800);
            }, 2000);
        }

        // ============================================
        // USER
        // ============================================
        function loadUser() {
            const saved = localStorage.getItem('sooverso_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                updateUserDisplay();
            }
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const userType = document.getElementById('loginType').value;

            if (!username || !email) {
                showAlert('username and email required', 'error');
                return;
            }

            currentUser = {
                username,
                email,
                userType,
                joinedAt: Date.now(),
                stickers: [],
                unlockedSkins: ['default'],
                seen: [],
                passed: []
            };

            localStorage.setItem('sooverso_user', JSON.stringify(currentUser));
            updateUserDisplay();
            toggleLogin();
            showAlert(`welcome, ${username}!`, 'success');
            playSound('unlock');
        }

        function toggleLogin() {
            const overlay = document.getElementById('loginOverlay');
            overlay.classList.toggle('open');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('sooverso_user');
            updateUserDisplay();
            showAlert('logged out', 'info');
        }

        function updateUserDisplay() {
            const display = document.getElementById('usernameDisplay');
            const avatar = document.getElementById('avatarDisplay');
            if (currentUser) {
                display.textContent = currentUser.username;
                avatar.textContent = '👤';
            } else {
                display.textContent = 'guest';
                avatar.textContent = '👤';
            }
        }

        // ============================================
        // DUEL
        // ============================================
        function loadDuel() {
            const container = document.getElementById('duelContainer');
            
            // Check if user has seen all duels
            if (currentUser && currentUser.seen && currentUser.seen.length >= SAMPLE_DUELS.length) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="big-icon">🔄</div>
                        <h3>you're caught up</h3>
                        <p>check back tomorrow for fresh duels</p>
                        <div class="invite-prompt" onclick="showAlert('share this link with friends!', 'info')">
                            invite a friend to unlock new rooms ✨
                        </div>
                    </div>
                `;
                return;
            }

            // Get unseen duel
            const available = SAMPLE_DUELS.filter(d => 
                !currentUser || !currentUser.seen || !currentUser.seen.includes(d.id)
            );

            if (available.length === 0) {
                // Rotate passed duels back in
                if (currentUser && currentUser.passed && currentUser.passed.length > 0) {
                    const passedDuel = SAMPLE_DUELS.find(d => currentUser.passed.includes(d.id));
                    if (passedDuel) {
                        currentUser.passed = currentUser.passed.filter(id => id !== passedDuel.id);
                        currentDuel = passedDuel;
                        renderDuel();
                        return;
                    }
                }
                // If nothing, show empty state
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="big-icon">🔄</div>
                        <h3>you're caught up</h3>
                        <p>check back tomorrow for fresh duels</p>
                    </div>
                `;
                return;
            }

            currentDuel = available[Math.floor(Math.random() * available.length)];
            renderDuel();
        }

        function renderDuel() {
            if (!currentDuel) return;
            const container = document.getElementById('duelContainer');
            const { prod1, prod2, id } = currentDuel;

            // Check if user has voted on this duel
            const hasVoted = userVotes.includes(id);

            container.innerHTML = `
                <div class="product-card" onclick="voteDuel(1)">
                    <div class="merchant-badge">${prod1.merchant}</div>
                    <div class="product-emoji">${prod1.emoji || '🏆'}</div>
                    <div class="product-name">${prod1.name}</div>
                    <div class="product-price">${prod1.price}</div>
                    <div class="product-desc">wins: <strong>${prod1.wins}</strong></div>
                    <button class="vote-btn" ${hasVoted ? 'disabled' : ''}>
                        ${hasVoted ? 'voted!' : 'pick this'}
                    </button>
                </div>
                <div class="product-card" onclick="voteDuel(2)">
                    <div class="merchant-badge">${prod2.merchant}</div>
                    <div class="product-emoji">${prod2.emoji || '⚡'}</div>
                    <div class="product-name">${prod2.name}</div>
                    <div class="product-price">${prod2.price}</div>
                    <div class="product-desc">wins: <strong>${prod2.wins}</strong></div>
                    <button class="vote-btn" ${hasVoted ? 'disabled' : ''}>
                        ${hasVoted ? 'voted!' : 'pick this'}
                    </button>
                </div>
            `;
        }

        function voteDuel(productNum) {
            if (!currentUser) {
                showAlert('login to vote', 'info');
                return;
            }

            const duelId = currentDuel.id;
            if (userVotes.includes(duelId)) {
                showAlert('you already voted on this duel', 'info');
                return;
            }

            const winner = productNum === 1 ? currentDuel.prod1 : currentDuel.prod2;
            currentDuel[`prod${productNum}`].wins += 1;
            userVotes.push(duelId);

            // Mark as seen
            if (!currentUser.seen) currentUser.seen = [];
            if (!currentUser.seen.includes(duelId)) {
                currentUser.seen.push(duelId);
            }

            localStorage.setItem('sooverso_user', JSON.stringify(currentUser));

            playSound('vote');
            showAlert(`you picked ${winner.name}!`, 'success');
            
            // Show finisher sticker
            playFinisher(winner.emoji || '🏆');
            
            // Maybe award a sticker
            if (Math.random() < 0.2) {
                setTimeout(() => getGumballSticker(), 500);
            }

            // Open payment after vote
            setTimeout(() => {
                openPayment();
            }, 300);

            setTimeout(() => {
                loadDuel();
                updateTicker();
            }, 2000);
        }

        // ============================================
        // FINISHER ANIMATIONS
        // ============================================
        function playFinisher(emoji) {
            const el = document.createElement('div');
            el.className = 'finisher';
            el.textContent = emoji || '🌪️';
            el.style.animation = 'tornadoSlide 2.5s steps(12) forwards';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }

        function flushLoser(emoji) {
            const el = document.createElement('div');
            el.className = 'finisher';
            el.textContent = emoji || '🚽';
            el.style.animation = 'flushDown 1.5s ease-in forwards';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        // ============================================
        // GUMBALL MACHINE
        // ============================================
        function getGumballSticker() {
            const sticker = gumballStickers[Math.floor(Math.random() * gumballStickers.length)];
            if (currentUser) {
                if (!currentUser.stickers) currentUser.stickers = [];
                currentUser.stickers.push(sticker);
                localStorage.setItem('sooverso_user', JSON.stringify(currentUser));
            }
            showGumballAnimation(sticker);
            playSound('unlock');
        }

        function showGumballAnimation(sticker) {
            const overlay = document.getElementById('gumballOverlay');
            const display = document.getElementById('gumballDisplay');
            
            overlay.classList.add('active');
            display.textContent = '🟠';
            display.style.animation = 'gumballDrop 1.8s ease forwards';
            
            setTimeout(() => {
                display.textContent = sticker;
                display.style.animation = 'none';
                display.style.transform = 'scale(1) rotate(0deg)';
            }, 1500);
            
            setTimeout(() => {
                overlay.classList.remove('active');
                showAlert(`🎉 you got a sticker: ${sticker}`, 'success');
            }, 2500);
        }

        // ============================================
        // CHAT
        // ============================================
        function toggleChat() {
            chatOpen = !chatOpen;
            const app = document.getElementById('app');
            const panel = document.getElementById('chatPanel');
            const arena = document.getElementById('duelArena');
            
            app.classList.toggle('chat-open');
            panel.classList.toggle('open');
            arena.classList.toggle('chat-open');
            
            document.getElementById('chatToggle').textContent = chatOpen ? '✕' : 'chat';
            
            if (chatOpen) {
                document.getElementById('chatInput').focus();
            }
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message';
            const username = currentUser ? currentUser.username : 'guest';
            div.innerHTML = `<span class="msg-user">${username}:</span> ${msg}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            input.value = '';
            
            playSound('chat');
        }

        // ============================================
        // ROOMS
        // ============================================
        function toggleRooms() {
            roomsOpen = !roomsOpen;
            document.getElementById('roomsDropdown').classList.toggle('open');
        }

        function joinRoom(roomName) {
            toggleRooms();
            showAlert(`joined #${roomName}`, 'info');
            // Add room to chat
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `<span class="msg-user">system:</span> joined #${roomName}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            if (!chatOpen) toggleChat();
        }

        // ============================================
        // PAYMENT
        // ============================================
        function openPayment() {
            document.getElementById('paymentModal').classList.add('open');
        }

        function closePayment() {
            document.getElementById('paymentModal').classList.remove('open');
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrcode').style.display = 'none';
            document.getElementById('paymentInfo').style.display = 'none';
            document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('active'));
        }

        function selectPayment(method) {
            document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('active'));
            event.target.closest('.pay-method').classList.add('active');
            
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            qrcodeDiv.style.display = 'block';
            
            const paymentUrls = {
                stripe: 'https://stripe.com/pay/sooverso',
                paypal: 'https://paypal.me/sooverso',
                crypto: 'bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq',
                tg: 'https://t.me/sooverso_bot?start=payment'
            };
            
            try {
                new QRCode(qrcodeDiv, {
                    text: paymentUrls[method],
                    width: 200,
                    height: 200,
                    colorDark: '#00ffff',
                    colorLight: '#1a1f3a'
                });
            } catch(e) {
                qrcodeDiv.innerHTML = `<p style="color:#ff00ff;font-size:0.8rem;">QR: ${paymentUrls[method]}</p>`;
            }
            
            document.getElementById('paymentInfo').style.display = 'block';
            document.getElementById('paymentInfo').textContent = `scan to pay via ${method.toUpperCase()}`;
        }

        // ============================================
        // TICKER
        // ============================================
        function updateTicker() {
            const sorted = [...SAMPLE_DUELS].sort((a, b) => b.prod1.wins - a.prod1.wins);
            const top3 = sorted.slice(0, 3);
            const ticker = document.querySelector('.ticker marquee');
            if (ticker) {
                ticker.textContent = `🏆 ${top3.map((d, i) => `#${i+1} ${d.prod1.name} (${d.prod1.wins} wins)`).join(' • ')} • so overso • `;
            }
        }

        // ============================================
        // ALERTS
        // ============================================
        function showAlert(msg, type) {
            const container = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = msg;
            container.appendChild(alert);
            setTimeout(() => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s';
                setTimeout(() => alert.remove(), 500);
            }, 3000);
        }

        // ============================================
        // SOUND
        // ============================================
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                switch(type) {
                    case 'vote':
                        osc.frequency.value = 880;
                        gain.gain.value = 0.08;
                        osc.start();
                        setTimeout(() => osc.stop(), 100);
                        break;
                    case 'unlock':
                        osc.frequency.value = 523;
                        gain.gain.value = 0.08;
                        osc.start();
                        setTimeout(() => { osc.frequency.value = 659; }, 150);
                        setTimeout(() => { osc.frequency.value = 784; }, 300);
                        setTimeout(() => osc.stop(), 450);
                        break;
                    case 'chat':
                        osc.frequency.value = 440;
                        gain.gain.value = 0.04;
                        osc.start();
                        setTimeout(() => osc.stop(), 50);
                        break;
                }
            } catch(e) {
                // Audio not available, silently fail
            }
        }

        // ============================================
        // SKIN SYSTEM (placeholder for now)
        // ============================================
        function applySkin(skinName) {
            const skin = skins[skinName] || skins.default;
            // Apply skin to body
            document.body.style.background = skin.background;
            // More skin application logic would go here
            showAlert(`skin applied: ${skinName}`, 'info');
        }

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
