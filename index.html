<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So Over So — Duel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* neon glow base */
        .neon {
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: linear-gradient(145deg, #111 0%, #0a0a0a 100%);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* header with timer */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            background: #1a1a1a;
            padding: 0.25rem 1rem;
            border-radius: 3rem;
            letter-spacing: 0.1em;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05);
        }

        /* duel arena */
        .duel {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            margin: 2rem 0;
        }

        .card {
            flex: 1;
            min-width: 250px;
            background: linear-gradient(145deg, #1a1a1a 0%, #121212 100%);
            border-radius: 1.5rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #2a2a2a;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd966;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.875rem;
            color: #aaa;
            line-height: 1.4;
        }

        .vs {
            font-size: 2rem;
            font-weight: 800;
            background: #ff3366;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            align-self: center;
            box-shadow: 0 0 15px rgba(255,51,102,0.5);
            text-shadow: none;
        }

        /* result overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .winner-card {
            background: #1a1a1a;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .winner-card button {
            background: #ff3366;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-top: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ SO OVER SO</h1>
            <div class="timer" id="timerDisplay">00:30</div>
        </div>

        <div class="duel" id="duelContainer">
            <!-- card A -->
            <div class="card" data-product="A" id="productA">
                <div class="card-image">🥾</div>
                <div class="card-title">Trailblazer Boot</div>
                <div class="card-price">$89</div>
                <div class="card-desc">Waterproof. Broken in. Ready for anything.</div>
            </div>

            <div class="vs">VS</div>

            <!-- card B -->
            <div class="card" data-product="B" id="productB">
                <div class="card-image">👟</div>
                <div class="card-title">City Runner</div>
                <div class="card-price">$79</div>
                <div class="card-desc">Light. Breathable. Built for pavement.</div>
            </div>
        </div>

        <div class="footer">
            pick a winner. the loser disappears.
        </div>
    </div>

    <!-- winner overlay -->
    <div class="overlay" id="winnerOverlay">
        <div class="winner-card">
            <h2>🏆 YOU CHOSE</h2>
            <div id="winnerName" style="font-size: 2rem; margin: 1rem 0;">Product</div>
            <button id="closeOverlay">continue →</button>
        </div>
    </div>

    <script>
        // timer logic
        let timeLeft = 30;
        const timerDisplay = document.getElementById('timerDisplay');
        const productA = document.getElementById('productA');
        const productB = document.getElementById('productB');
        const duelContainer = document.getElementById('duelContainer');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerNameSpan = document.getElementById('winnerName');
        const closeOverlay = document.getElementById('closeOverlay');

        let duelActive = true;
        let timerInterval;

        function updateTimerDisplay() {
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `00:${seconds.toString().padStart(2, '0')}`;
        }

        function endDuel(winnerProductId) {
            if (!duelActive) return;
            duelActive = false;
            if (timerInterval) clearInterval(timerInterval);

            // get winner name
            let winnerName = '';
            if (winnerProductId === 'A') {
                winnerName = productA.querySelector('.card-title').innerText;
                // animate loser out (product B)
                productB.style.transition = 'all 0.3s ease';
                productB.style.opacity = '0';
                productB.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    productB.remove();
                }, 300);
            } else {
                winnerName = productB.querySelector('.card-title').innerText;
                productA.style.transition = 'all 0.3s ease';
                productA.style.opacity = '0';
                productA.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    productA.remove();
                }, 300);
            }

            // remove VS
            const vsElement = document.querySelector('.vs');
            if (vsElement) vsElement.remove();

            // show winner overlay
            winnerNameSpan.innerText = winnerName;
            winnerOverlay.classList.add('active');
        }

        // start timer
        function startTimer() {
            timerInterval = setInterval(() => {
                if (!duelActive) return;
                if (timeLeft <= 1) {
                    // time's up — no winner? decide randomly? 
                    // for now, just end with a random pick
                    clearInterval(timerInterval);
                    const randomWinner = Math.random() > 0.5 ? 'A' : 'B';
                    endDuel(randomWinner);
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        // handle card click
        function handleProductClick(productId) {
            if (!duelActive) return;
            endDuel(productId);
        }

        productA.addEventListener('click', () => handleProductClick('A'));
        productB.addEventListener('click', () => handleProductClick('B'));

        closeOverlay.addEventListener('click', () => {
            winnerOverlay.classList.remove('active');
            // optional: reset the duel? for demo, just leave as is
        });

        // initialize
        updateTimerDisplay();
        startTimer();
    </script>
</body>
</html>
